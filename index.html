<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Expense Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-200 min-h-screen flex items-start sm:items-center justify-center p-4">
    <div class="bg-white shadow-xl rounded-2xl w-full max-w-lg p-4 sm:p-6">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">💰 Expense Tracker</h1>

        <!-- Balanace Summary Card -->
        <div class="grid grid-cols-3 gap-2 sm:gap-4 mb-6 text-center">
            <div class="min-w-0 bg-emerald-50 p-2 sm:p-3 rounded-xl border border-emerald-400">
                <p class="text-xs text-emerald-600 font-semibold">Income</p>
                <p id="totalIncome" class="break-all text-sm sm:text-xl font-bold text-emerald-700">+$0</p>
            </div>
            <div class="min-w-0 bg-rose-50 p-2 sm:p-3 rounded-xl border border-rose-400">
                <p class="text-xs text-rose-600 font-semibold">Expense</p>
                <p id="totalExpense" class="break-all text-sm sm:text-xl font-bold text-rose-700">-$0</p>
            </div>
            <div class="min-w-0 bg-sky-50 p-2 sm:p-3 rounded-xl border border-sky-400">
                <p class="text-xs text-sky-600 font-semibold">Balance</p>
                <p id="netBalance" class="break-all text-sm sm:text-xl font-bold text-sky-700">$0</p>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <form id="transactionForm" class="space-y-5 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <input type="text" id="descInput" placeholder="e.g., Salary, Groceries..." required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Amount (+ for Income, - for Expense)</label>
                <input type="number" id="amountInput" placeholder="e.g., 500 or -50" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300">
            </div>
            <button type="submit" class="w-full bg-orange-300 text-white font-semibold py-2 rounded-lg hover:bg-orange-400 transition cursor-pointer">Add Transaction</button>
        </form>

        <!-- Transaction History List -->
        <div>
            <h2 class="text-lg font-semibold text-gray-800 mb-3">Transaction History</h2>
            <ul id="transactionList" class="space-y-2 max-h-48 overflow-y-auto overflow-x-hidden" hidden>
                <!-- Transactions will be dynamically added here -->
            </ul>
            <p id="noTransactions" class="text-center text-gray-500 italic text-sm py-4">No transactions added yet.</p>
        </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
